# Standalone 7 Days to Die server. Not part of the GameManager compose file:
#   docker compose -f images/7dtd/docker-compose.yml up -d --build
# Settings come from ../../configs/7dtd, game data and saves land in ../../servers/7dtd.
services:
  7dtd:
    build: .
    platform: linux/amd64 # x86_64 hosts only: the game crashes in emulation on Apple Silicon/ARM
    container_name: 7dtd
    restart: unless-stopped
    ports:
      - "26900:26900/tcp"
      - "26900-26903:26900-26903/udp"
    environment:
      SDTD_BRANCH: "public" # Steam branch: "public" = latest stable, or e.g. "v3.2.0", "latest_experimental"
      SDTD_UPDATE: "true" # check for game updates on every start
      PUID: "1000" # owner of the files in ../../servers/7dtd
      PGID: "1000"
    volumes:
      - ../../configs/7dtd:/config:ro # your settings, applied on every start
      - ../../servers/7dtd/server:/server # game files (about 18 GB)
      - ../../servers/7dtd/data:/data # saves, generated worlds, effective serverconfig.xml
    ulimits:
      nofile: 10240
    stop_grace_period: 2m # time to save the world on stop
