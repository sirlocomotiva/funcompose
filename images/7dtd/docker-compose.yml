# 7 Days to Die dedicated server:
#   docker compose -f images/7dtd/docker-compose.yml up -d --build
# Settings come from ../../configs/7dtd, game data and saves land in ../../servers/7dtd.
#
# Copy every config file the game ships into ../../configs/7dtd, to edit before
# the first start (and again after a game update):
#   docker compose -f images/7dtd/docker-compose.yml run --rm pull
x-sdtd-env: &sdtd-env
  SDTD_BRANCH: "public" # Steam branch: "public" = latest stable, or e.g. "v3.2.0", "latest_experimental"
  PUID: "1000" # owner of the files in ../../servers/7dtd and ../../configs/7dtd (rootless Podman: 0)
  PGID: "1000"

services:
  7dtd:
    build: .
    image: funcompose/7dtd
    platform: linux/amd64 # x86_64 hosts only: the game crashes in emulation on Apple Silicon/ARM
    container_name: 7dtd
    restart: unless-stopped
    ports:
      - "26900:26900/tcp"
      - "26900-26903:26900-26903/udp"
    environment:
      <<: *sdtd-env
      SDTD_UPDATE: "true" # check for game updates on every start
    volumes:
      - ../../configs/7dtd:/config:ro # your settings, applied on every start
      - ../../servers/7dtd/server:/server # game files (about 18 GB)
      - ../../servers/7dtd/data:/data # saves, generated worlds, effective serverconfig.xml
    ulimits:
      nofile: 10240
    stop_grace_period: 2m # time to save the world on stop

  # Downloads only the game's config files (a few MB), so it also works on Apple Silicon.
  pull:
    build: .
    image: funcompose/7dtd
    platform: linux/amd64
    profiles: ["tools"] # not started by "up"
    command: ["pull"]
    environment: *sdtd-env
    volumes:
      - ../../configs/7dtd:/config
