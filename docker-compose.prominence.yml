services:
  minecraft-prominence-ii:
    image: itzg/minecraft-server:java17
    container_name: minecraft-prominence-ii
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: "https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era"
      CF_FILENAME_MATCHER: "4.0.1"
      CF_API_KEY: "${CF_API_KEY:-}"
      MODRINTH_PROJECTS: "distanthorizons"
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"
      VERSION: "1.20.1"
      MEMORY: "8G"
      MAX_PLAYERS: "20"
      MOTD: "Prominence II [RPG]: Hasturian Era v4.0.1 Server (with Distant Horizons)"
      ONLINE_MODE: "FALSE"
    volumes:
      - prominence_data:/data
    tty: true
    stdin_open: true

volumes:
  prominence_data:
