# GameManager — one compose file, every OS (Windows/macOS/Linux via Docker Desktop).
#
# Game servers (Minecraft, Valheim, Terraria, 7 Days to Die) are NOT defined here.
# They are created dynamically from the web UI: http://localhost:5173
#
# Optional config lives in .env (copy .env.example -> .env).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      # Works on Docker Desktop for Windows, macOS and Linux.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - game-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATA_PATH=/data
      - CF_API_KEY=${CF_API_KEY:-}
      - PORT_RANGE_START=${PORT_RANGE_START:-25565}
      - PORT_RANGE_END=${PORT_RANGE_END:-25765}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  game-data:
