services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      - DATA_PATH=/data
      - CF_API_KEY=${CF_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  prominence:
    image: itzg/minecraft-server:java17
    container_name: prominence
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "AUTO_CURSEFORGE"
      CF_PAGE_URL: "https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era"
      CF_FILENAME_MATCHER: "4.0.1"
      CF_API_KEY: ${CF_API_KEY:-}
      MODRINTH_PROJECTS: "distanthorizons,xaeros-maps-multiplayer-plus"
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"
      VERSION: "1.20.1"
      MEMORY: "8G"
      MAX_PLAYERS: "20"
      MOTD: "Prominence II [RPG]: Hasturian Era v4.0.1 Server (with Distant Horizons & Xaero's Maps Sync)"
      ONLINE_MODE: "FALSE"
    volumes:
      - ./servers/prominence:/data
    tty: true
    stdin_open: true
    profiles:
      - prominence
      - all

  vanilla:
    image: itzg/minecraft-server:java21
    container_name: vanilla
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "LATEST"
      MEMORY: "2G"
      MAX_PLAYERS: "20"
      MOTD: "Vanilla Minecraft Server"
      ONLINE_MODE: "FALSE"
    volumes:
      - ./servers/vanilla:/data
    tty: true
    stdin_open: true
    profiles:
      - vanilla
      - all
